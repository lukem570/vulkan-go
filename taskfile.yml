version: '3'

tasks:
  setup:
    desc: Initialize Vulkan-Headers submodule (vk.xml is required for code generation)
    cmds:
      - git submodule update --init mod/Vulkan-Headers

  generate:
    desc: Generate the go bindings
    deps: [ 'setup' ]
    env:
      GOWORK: "off"
    cmds:
      - rm -rf ./v1
      - mkdir -p ./v1
      - go run ./cmd/vkgen

  test:
    desc: Test Vulkan compute (no CGo required)
    deps: [ 'generate' ]
    env:
      CGO_ENABLED: "0"
      GOWORK: "off"
    cmds:
      - glslc -o ./examples/compute/test.spv ./examples/compute/test.comp
      - go run ./examples/compute
