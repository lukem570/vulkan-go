version: '3'

tasks:
  setup:
    desc: Initialize Vulkan-Headers submodule (vk.xml is required for code generation)
    cmds:
      - git submodule update --init mod/Vulkan-Headers

  generate:
    desc: Generate the go bindings
    deps: [ 'setup' ]
    env:
      GOWORK: "off"
    cmds:
      - rm -rf ./v1
      - mkdir -p ./v1
      - go run ./cmd/vkgen

  test:
    desc: Run the Go test suite (ABI conformance + generator goldens; no GPU needed)
    deps: [ 'generate' ]
    env:
      CGO_ENABLED: "0"
      GOWORK: "off"
    cmds:
      # examples/ is excluded: it go:embeds test.spv, which is gitignored and
      # only exists after `task test:compute` has run glslc.
      - go test ./internal/... ./v1/...

  test:compute:
    desc: Run the headless compute example end to end (needs glslc and a Vulkan driver)
    deps: [ 'generate' ]
    env:
      CGO_ENABLED: "0"
      GOWORK: "off"
    cmds:
      - glslc -o ./examples/compute/test.spv ./examples/compute/test.comp
      - go run ./examples/compute

  test:cgo:
    desc: Run the Go test suite with CGo enabled (goffi supports both modes)
    deps: [ 'generate' ]
    env:
      CGO_ENABLED: "1"
      GOWORK: "off"
    cmds:
      - go test ./internal/... ./v1/...

  test:both:
    desc: Run the test suite in both CGo modes
    cmds:
      - task: test
      - task: test:cgo

  golden:update:
    desc: Rewrite the generator golden files, then review the diff before committing
    env:
      CGO_ENABLED: "0"
      GOWORK: "off"
    cmds:
      - go test ./internal/generator -update
      - git diff --stat internal/generator/testdata
