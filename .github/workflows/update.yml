name: Update Vulkan Bindings

on:
  schedule:
    - cron: "0 */6 * * *" # check every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update submodules
        run: |
          git submodule foreach 'git fetch origin'
          git submodule update --remote --checkout

      - name: Stage submodule changes
        run: |
          git add mod/Vulkan-Headers

      - name: Check for submodule changes
        id: changes
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Go
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-go@v5
        with:
          # go.mod is the single source of truth. A hardcoded version here only
          # worked by way of the toolchain auto-download.
          go-version-file: go.mod

      - name: Install Task
        if: steps.changes.outputs.changed == 'true'
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest

      - name: Setup mod
        if: steps.changes.outputs.changed == 'true'
        run: task setup

      - name: Run generator
        if: steps.changes.outputs.changed == 'true'
        run: task generate

      # The ABI probe compiles against the real platform headers. Without these
      # the xlib, xcb and wayland groups skip themselves, which would leave the
      # platform surface structs unverified against the new headers.
      - name: Install platform development headers
        if: steps.changes.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxcb1-dev libwayland-dev

      # Gate the update on the test suite. `task test` regenerates and then runs
      # the ABI conformance and generator golden suites, so a header change that
      # shifts a struct offset, changes an enumerant value, or breaks a
      # generator convention stops the workflow here rather than being committed
      # and tagged as a release.
      - name: Test regenerated bindings
        if: steps.changes.outputs.changed == 'true'
        run: task test

      # task test builds for the host only, and the per-platform files are
      # build-tagged, so a new or changed platform struct can break the windows
      # or darwin file without the suite noticing.
      - name: Verify every target compiles
        if: steps.changes.outputs.changed == 'true'
        env:
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: |
          go vet ./internal/... ./cmd/... ./v1/...
          for target in \
            linux/amd64 linux/arm64 \
            windows/amd64 windows/arm64 \
            darwin/amd64 darwin/arm64
          do
            echo "::group::$target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./v1
            echo "::endgroup::"
          done

      - name: Extract Vulkan version
        if: steps.changes.outputs.changed == 'true'
        id: version
        run: |
          HEADER=mod/Vulkan-Headers/include/vulkan/vulkan_core.h

          LINE=$(grep VK_HEADER_VERSION_COMPLETE $HEADER)

          MAJOR=$(echo "$LINE" | sed -E 's/.*\([0-9]+, ([0-9]+), ([0-9]+),.*/\1/')
          MINOR=$(echo "$LINE" | sed -E 's/.*\([0-9]+, ([0-9]+), ([0-9]+),.*/\2/')
          PATCH=$(grep "^#define VK_HEADER_VERSION " $HEADER | awk '{print $3}')

          VERSION="v$MAJOR.$MINOR.$PATCH"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected Vulkan version $VERSION"

      - name: Commit generated code
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "Update bindings for Vulkan ${{ steps.version.outputs.version }}" || echo "No changes"

      - name: Create tag
        if: steps.changes.outputs.changed == 'true'
        run: |
          git tag ${{ steps.version.outputs.version }} || true

      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push
          git push --tags